[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peddet-orin"
version = "0.1.0"
description = "Person detection with torchvision SSDLite on a Jetson Orin Nano, in FP32, FP16 and INT8."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.9",
    "torchvision>=0.24",
    "numpy<2",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "pycocotools>=2.0.8",
    "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
