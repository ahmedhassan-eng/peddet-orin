name: ci
on:
  push:
jobs:
  cpu-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only dependencies
        run: |
          python -m pip install -r requirements/ci-cpu.txt
          python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest
